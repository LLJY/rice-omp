providers:
  # Every chat model: Codex Responses over WebSocket via CLIProxyAPI's /backend-api/codex/responses.
  # Later turns send previous_response_id + only the new input. The proxy's /v1/models has no
  # endpoint types, so discovery cannot pick this API: list ids here (limits come from omp's catalog).
  cpa:
    baseUrl: http://127.0.0.1:8317/backend-api
    api: openai-codex-responses
    apiKey: CPA_KEY
    models:
      - id: claude-3-5-haiku-20241022
        preferWebsockets: true
      - id: claude-3-7-sonnet-20250219
        preferWebsockets: true
      - id: claude-fable-5
        preferWebsockets: true
      - id: claude-fable-5-1
        preferWebsockets: true
      - id: claude-haiku-4-5-20251001
        preferWebsockets: true
      - id: claude-opus-4-1-20250805
        preferWebsockets: true
      - id: claude-opus-4-20250514
        preferWebsockets: true
      - id: claude-opus-4-5-20251101
        preferWebsockets: true
      - id: claude-opus-4-6
        preferWebsockets: true
      - id: claude-opus-4-7
        preferWebsockets: true
      - id: claude-opus-4-8
        preferWebsockets: true
      - id: claude-opus-5
        preferWebsockets: true
      - id: claude-opus-5-5
        preferWebsockets: true
      - id: claude-sonnet-4-20250514
        preferWebsockets: true
      - id: claude-sonnet-4-5-20250929
        preferWebsockets: true
      - id: claude-sonnet-4-6
        preferWebsockets: true
      - id: claude-sonnet-5
