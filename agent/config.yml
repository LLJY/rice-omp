setupVersion: 2
disabledProviders:
  - opencode
# remote: server-side compaction (GPT models via CPA). handoff/soft: written LLM summaries.
# shake: no-model fallback. snapcompact (bitmap archive) is left out on purpose.
compaction:
  methodOrder: [remote, handoff, soft, shake]
  # Display-only for ompweb, which only knows the legacy key (and shows `snapcompact` when it is
  # absent). omp ignores `strategy` whenever `methodOrder` is set.
  strategy: handoff
# The following equal omp's defaults; they are pinned because ompweb shows its own fallbacks
# (mnemopi memory, autolearn on, 2 retries without model fallback) for keys missing here.
memory:
  backend: off
autolearn:
  enabled: false
  autoContinue: false
retry:
  maxRetries: 10
  modelFallback: true
# Native generate_image (replaces rice-opencode's viz plugin); models come from cpa-images.
generate_image:
  enabled: true
tui:
  mouse: true
display:
  pinnedAgents: full
  subagentLivePreview: true
modelRoles:
  smol: cpa/gpt-6-luna:max
  advisor: cpa/gpt-6.1-sol:xhigh
  judge: cpa/gpt-6.1-sol:xhigh
  task: cpa/claude-sonnet-5-5:high
  default: cpa/claude-opus-5-5:high
  review: cpa/gpt-6.1-sol:xhigh
  plan-check: cpa/gpt-6.1-sol:xhigh
  research: cpa/gpt-6.1-sol:xhigh
  proofread: cpa/gpt-6.1-sol:xhigh
  web: web/exa
modelPresets:
  Default:
    modelRoles:
      smol: cpa/gpt-6-luna:max
      default: cpa/claude-opus-5-5:high
      advisor: cpa/gpt-6.1-sol:xhigh
      judge: cpa/gpt-6.1-sol:xhigh
      task: cpa/claude-sonnet-5-5:high
      review: cpa/gpt-6.1-sol:xhigh
      plan-check: cpa/gpt-6.1-sol:xhigh
      research: cpa/gpt-6.1-sol:xhigh
      proofread: cpa/gpt-6.1-sol:xhigh
      web: web/exa
    defaultThinkingLevel: high